<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Meeting Prep" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .folder { transform-box: fill-box; transform-origin: 50% 100%; animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .m { stroke-dasharray: 100; animation: draw 0.6s 0.3s cubic-bezier(0.4, 0, 0.2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px) scaleY(0.88); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .folder, .m { animation: none; } }
  </style>
  <path class="folder" d="M3 9h16l4 5h22v28H3z" fill="#b8863b"/>
  <path class="m" pathLength="100" d="M12 36V22l12 9 12-9v14" fill="none" stroke="#171b24" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
